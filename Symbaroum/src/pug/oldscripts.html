<script type="text/worker">

var Sheet = Sheet || (function() {

	var version= 1.0,
	Debug = false,	
// convert weapon quality selector from numeric value to text
	qualitySwap = function() {
// get weapon quality text values
		getAttrs(["weapon1-quality"], function(values) {
			var qualityName, 
				list=["None", "Balanced", "Blunt", "Deep Impact", "Jointed", "Long", "Precise", "Short"],
				index = ~~values["weapon1-quality"];
				qualityName = list[index];
			console.log("....Given: " + values["weapon1-quality"] );
			console.log("....Index: " + index );
			console.log("....QualityName: " + qualityName );
				setAttrs({
					"weapon1-quality":qualityName
				});
		});

// get repeating weapon quality text values
		getSectionIDs("repeating_weapons", function(ids) {
			var fields = _.map(ids,function(id) {
				return "repeating_weapons_" + id + "_weapon1-quality";
				console.log("....Row id " + id );
			});

			getAttrs(fields, function(values) {
				_.each(ids, function(rowid, i) {												
					console.log("....repeating_weapons_" + rowid + "_weapon1-quality");
					var qualityName,
						list=["None", "Balanced", "Blunt", "Deep Impact", "Jointed", "Long", "Precise", "Short"],
						index = ~~values["repeating_weapons_" + rowid + "_weapon1-quality"];
						qualityName = list[index];
					console.log("....Row id " + rowid );
					console.log("....Given: " + values["repeating_weapons_" + rowid + "_weapon1-quality"] );
					console.log("....Index: " + index );
					console.log("....QualityName: " + qualityName );
						setAttrs({
						["repeating_weapons_" + rowid + "_weapon1-quality"]:qualityName
					});
				});
			});
		});		

	},

/* recalculateSheet */
	recalculateSheet = function(oldversion) {
		if (oldversion < 0.1) {
//call your functions here
		qualitySwap();
		}
	},
	
/* checkForUpdate looks at current version of page in
 * sheet_version and compares to code Sheet.version calls
 * recalulateSheet if versions don"t match or if recalculate
 * button was pressed. */
	checkForUpdate = function() {
		getAttrs(["sheet_version","sheet_forcesync","recalc1"],function(v){
			var setter={},currVer=0,setAny=0,recalc=false;
			currVer=parseFloat(v["sheet_version"],10)||0;
			console.log("Current sheet data version:"+currVer+", Sheet code version:" + version );
			
			if ( currVer!== version ) {
				recalc=true;
				setter["sheet_version"]= version;
				setAny=1;
			}
			if (v["recalc1"] && v["recalc1"]!="0" ) {
				currVer=-1;
				recalc=true;
				setter["recalc1"]=0;
				setAny=1;
			}
			if (v["sheet_forcesync"] && v["sheet_forcesync"]!="0" ) {
				currVer=-1;
				recalc=true;
				setter["sheet_forcesync"]=0;
				setAny=1;
			}
			if (setAny) {
				 setAttrs( setter);
			}
			if (recalc) {
				recalculateSheet(currVer);
			}
		});
	};
	return {
		version:version,
		checkForUpdate:checkForUpdate,
		qualitySwap:qualitySwap
	};
}());

//sheet
on("sheet:opened",function() {Sheet.checkForUpdate();});
on("change:recalc1",function() {Sheet.checkForUpdate();});

on("change:accurate change:cunning change:discreet change:persuasive change:quick change:resolute change:strong change:vigilant", function(eventInfo) {
	let TriggerName = eventInfo.triggerName;

	console.log("  TriggerName: " + TriggerName);
	console.log("  eventInfo: " + JSON.stringify(eventInfo));
	
	getAttrs(["accurate", "cunning", "discreet", "persuasive", "quick", "resolute", "strong", "vigilant"], function(values) {
		let Accurate = parseInt(values.accurate)||0;
		let Cunning = parseInt(values.cunning)||0;
		let Discreet = parseInt(values.discreet)||0;
		let Persuasive = parseInt(values.persuasive)||0;
		let Quick = parseInt(values.quick)||0;
		let Resolute = parseInt(values.resolute)||0;
		let Strong = parseInt(values.strong)||0;
		let PainThreshold = Math.ceil(Strong/2);
		let Vigilant = parseInt(values.vigilant)||0;
		console.log("  Accurate: " + Accurate + " Cunning " + Cunning + " Discreet "  + Discreet + " Persuasive " + Persuasive + "  Quick " + Quick + " Resolute " + Resolute + " Strong "  + Strong + " Vigilant " + Vigilant);
		console.log("  Toughness: " + Strong + " PainThreshold " + PainThreshold);

		let AttributeTotal =  Accurate + Cunning + Discreet + Persuasive + Quick + Resolute + Strong + Vigilant;
		console.log("  AttributeTotal: " +  AttributeTotal);
			
		setAttrs({ attribute_total: AttributeTotal, toughness: Strong, pain_threshold: PainThreshold});
	});
});

on("change:death1 change:death2 change:death3", function(eventInfo) {
	let TriggerName = eventInfo.triggerName;
	let Name = eventInfo.triggerName.substring(8);

	console.log("  TriggerName: " + TriggerName);
	console.log("  Name: " + Name);
	console.log("  eventInfo: " + JSON.stringify(eventInfo));
	
	getAttrs(["death_count", "death1", "death2", "death3"], function(values) {
		let DeathCount = parseInt(values.death_count)||0;
		let Death1 = parseInt(values.death1)||0;
		let Death2 = parseInt(values.death2)||0;
		let Death3 = parseInt(values.death3)||0;
		console.log("  DeathCount: " + DeathCount + " Death1 " + Death1 + " Death2 "  + Death2 + " Death3 " + Death3);

		let NewDeathCount = Death1 + Death2 + Death3;
		console.log("  NewDeathCount: " +  NewDeathCount);
		switch (NewDeathCount) {
			case 0: Death1 = 0; Death2 = 0; Death3 = 0; break;
			case 1: Death1 = 1; Death2 = 0; Death3 = 0; break;
			case 2: Death1 = 1; Death2 = 1; Death3 = 0; break;
			case 3: Death1 = 1; Death2 = 1; Death3 = 1; break;
			default: 
				console.log("  Invalid NewDeathCount: " + NewDeathCount);
		}
			
		setAttrs({ death_count: NewDeathCount, death1: Death1, death2: Death2, death3: Death3});
			
		console.log("  After NewDeathCount: " + NewDeathCount + " Death1 " + Death1 + " Death2 "  + Death2 + " Death3 " + Death3);

	});
});

on("clicked:DeathCheck", function(eventInfo) {
	let TriggerName = eventInfo.triggerName;
	let Name = eventInfo.triggerName.substring(8);

	console.log("  TriggerName: " + TriggerName);
	console.log("  Name: " + Name);
	console.log("  eventInfo: " + JSON.stringify(eventInfo));
	
	getAttrs(["death_count", "death1", "death2", "death3"], function(values) {
		let DeathCount = parseInt(values.death_count)||0;
		let Death1 = parseInt(values.death1)||0;
		let Death2 = parseInt(values.death2)||0;
		let Death3 = parseInt(values.death3)||0;
		console.log("  DeathCount: " + DeathCount + " Death1 " + Death1 + " Death2 "  + Death2 + " Death3 " + Death3);

		//      value= "&{template:check} {{death=@{character-name}}} {{title=Dices with Death}}  {{Roll=[[1d20]]}}"		
        let rollBase = "&{template:check} {{death=@{character_name}}} {{title=Dices with Death}}  {{Roll=[[1d20]]}}";
		console.log("  rollBase = " + rollBase);

	    startRoll(rollBase, rollResult => {
			console.log("  Roll: " + JSON.stringify(rollResult.results.Roll));
			let Result = rollResult.results.Roll.result;
			console.log("   Result: " + Result);
			if (Result > 10 && Result != 20) {
				DeathCount += 1; 
				console.log("  Now DeathCount: " + DeathCount);
				if ( DeathCount > 3) { DeathCount = 3;}
				switch (DeathCount) {
					case 1: Death1 = 1; break;
					case 2: Death1 = 1; Death2 = 1; break;
					case 3: Death1 = 1; Death2 = 1; Death3 = 1; break;
					default: 
						console.log("  Invalid DeathCount: " + DeathCount);
				}
			} else if (Result == 20) {
				Death1 = 1; Death2 = 1; Death3 = 1; DeathCount = 3;
				console.log("  Fumble! DeathCount: " + DeathCount + " Death1 " + Death1 + " Death2 "  + Death2 + " Death3 " + Death3);
			}
			
			setAttrs({ death_count: DeathCount, death1: Death1, death2: Death2, death3: Death3});
			
			console.log("  After DeathCount: " + DeathCount + " Death1 " + Death1 + " Death2 "  + Death2 + " Death3 " + Death3);
			
			finishRoll(
				rollResult.rollId,
				{

				}
			);
		});
	});
});

on("change:itemEnc change:repeatingEnc ", function(eventInfo) {
	let TriggerName = eventInfo.triggerName;

	console.log("  TriggerName: " + TriggerName);
	console.log("  eventInfo: " + JSON.stringify(eventInfo));
	
	getAttrs(["itemEnc", "repeatingEnc", "encumbrance"], function(values) {
		let ItemEnc = parseInt(values.itemEnc)||0;
		let RepeatingEnc = parseInt(values.repeatingEnc)||0;
		let OldEncumbrance = parseInt(values.encumbrance)||0;
		Encumbrance = ItemEnc + RepeatingEnc; 
		console.log("  Encumbrance: " + Encumbrance + " ItemEnc " + ItemEnc + " RepeatingEnc "  + RepeatingEnc + "  OldEncumbrance: " + OldEncumbrance);
			
		setAttrs({ encumbrance: Encumbrance});
	});
});

	"item_flint_and_steel_quantity", "item_flint_and_steel_enc", "item_rope_quantity", "item_rope_enc", "item_waterskin_quantity", "item_waterskin_enc"	], function(values) {

	// Walkthrough of repeating_item to recalcuate  encumbrance 						
	on('change:repeating_item:item-quantity change:repeating_item:item-enc', () => {
		console.log("In repeating_item when an item quantity or encumbrace changed");
		getSectionIDs(`repeating_item`, function(idArray) {
			// create a variable to hold all the needed attribute names
			var fieldnames = [];
			var TotalEnc = 0;
	
			for(var i = 0; i < idArray.length; i++) {
				fieldnames.push(
					"repeating_item_" + idArray[i] + "_item-name",
					"repeating_item_" + idArray[i] + "_item-quantity",
					"repeating_item_" + idArray[i] + "_item-enc"									
				);
			}
			getAttrs(fieldnames, function(values) {
				for(var i = 0; i < idArray.length; i++) {
					// Extract characteristics
					var name = values["repeating_item_" + idArray[i] + "_item-name"];
					var quantity = values["repeating_item_" + idArray[i] + "_item-quantity"];
					var encumbrance = values["repeating_item_" + idArray[i] + "_item-enc"];
					let ItemEnc = quantity * encumbrance;

					console.log(" Item: " + name + " Quantity: " + quantity + " Enc: " + encumbrance + " ItemEnc: " + ItemEnc);
					TotalEnc += ItemEnc;

					console.log("TotalEnc : " + TotalEnc);
				}
				console.log("   TotEnc = " + TotalEnc);
				setAttrs({	repeatingEnc: TotalEnc});
			});
		});
	});

</script>
