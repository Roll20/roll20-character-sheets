# Copied from roll20-private-sheets/.actions/sheet-checks/public. Edit it there, not here.
#
# pull_request_target runs this file and the action from master, never from the pull request, so a
# fork cannot change what runs. The pull request's files are checked out into .pull-request and
# only ever read as text. Never run, install or build anything from that folder.
name: Sheet Checks

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions: {}

concurrency:
  group: sheet-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-sheet:
    name: Check Sheet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pull request's files to read
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pull-request
          persist-credentials: false
      - name: Run Checks
        uses: ./.actions/sheet-checks
        with:
          sheet-root: .pull-request
