    <!--  Sheetworker  -->
    <script type="text/worker">
        on('sheet:opened', function() {

        });

        on('change:itemdata',(event) => {
            console.log(JSON.stringify(event));
            let data = JSON.parse(event.newValue);
            if(data.Category !== "Items") {
                console.log("Not an Item!");
                return;
            }

            let rowId = generateRowID();
            let attrs = {};
            attrs["repeating_item_" + rowId + "_name"] = data.DisplayName;
            attrs["repeating_item_" + rowId + "_cost"] = data.Cost;
            attrs["repeating_item_" + rowId + "_activation"] = data.Activation;
            attrs["repeating_item_" + rowId + "_uses"] = data.Uses;
            attrs["repeating_item_" + rowId + "_description"] = data.Description;
            attrs["repeating_item_" + rowId + "_img"] = data.Token;
            setAttrs(attrs);
        });

        on('change:armourdata',(event) => {
            console.log(JSON.stringify(event));
            let data = JSON.parse(event.newValue);
            if(data.Category !== "Armour") {
                console.log("Not an item!");
                return;
            }

            let rowId = generateRowID();
            let attrs = {};
            attrs["repeating_armour_" + rowId + "_armourname"] = data.DisplayName;
            attrs["repeating_armour_" + rowId + "_armourcost"] = data.Cost;
            attrs["repeating_armour_" + rowId + "_armourresistance"] = data.Resistance;
            attrs["repeating_armour_" + rowId + "_armourkeywords"] = data.Keywords;
            setAttrs(attrs, {silent:true});
        });

        on('change:chromedata',(event) => {
            console.log(JSON.stringify(event));
            let data = JSON.parse(event.newValue);
            if(data.Category !== "Chrome") {
                console.log("Not Chrome!");
                return;
            }

            let rowId = generateRowID();
            let attrs = {};
            attrs["repeating_chrome_" + rowId + "_chromename"] = data.DisplayName;
            attrs["repeating_chrome_" + rowId + "_chromecost"] = data.Cost;
            attrs["repeating_chrome_" + rowId + "_chromeslot"] = data.Slot;
            attrs["repeating_chrome_" + rowId + "_chromebonus"] = data.Bonus;
            attrs["repeating_chrome_" + rowId + "_chromedesc"] = data.Description;
            attrs["repeating_chrome_" + rowId + "_chromeimg"] = data.Token;
            setAttrs(attrs, {silent:true});
        });

        on('change:galdrdata',(event) => {
            console.log(JSON.stringify(event));
            let data = JSON.parse(event.newValue);
            if(data.Category !== "Galdrs") {
                console.log("Not Galdr!");
                return;
            }

            let rowId = generateRowID();
            let attrs = {};
            attrs["repeating_galdr_" + rowId + "_galdrname"] = data.DisplayName;
            attrs["repeating_galdr_" + rowId + "_galdrrequirement"] = data.Requirement;
            attrs["repeating_galdr_" + rowId + "_galdrlimit"] = data.Limit;
            attrs["repeating_galdr_" + rowId + "_galdrusage"] = data.Usage;
            attrs["repeating_galdr_" + rowId + "_galdrimage"] = data.Token;
            setAttrs(attrs, {silent:true});
        });
    </script>
